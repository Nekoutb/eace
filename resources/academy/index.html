<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elite Advisors Academy — Elite Advisors Compliance Engine</title>
<style>
  :root{
    --red:#E2382B; --red-d:#B62015; --ink:#111111; --ink-soft:#3a3a38; --muted:#6B6B6B;
    --paper:#F6F6F4; --white:#FFFFFF; --line:#e7e6e1;
    --green:#16A34A; --green-d:#15803d; --green-50:#f0fdf4; --green-100:#dcfce7;
    --amber:#b45309; --r:14px;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}

  /* ---- top bar ---- */
  header.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;
    padding:14px 26px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:34px;height:27px;flex:none}
  .brand .nm{font-weight:800;letter-spacing:.16em;font-size:15px;color:var(--ink)}
  .brand .nm .ad{color:var(--red)}
  .brand .ac{margin-left:10px;padding-left:12px;border-left:1px solid var(--line);font-weight:700;letter-spacing:.28em;font-size:11px;color:var(--muted);text-transform:uppercase}
  .spacer{flex:1}
  .langtoggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:700}
  .langtoggle button{border:0;background:var(--white);color:var(--muted);padding:6px 13px;cursor:pointer;letter-spacing:.04em}
  .langtoggle button.on{background:var(--ink);color:#fff}
  .pbar{height:5px;background:var(--line);border-radius:999px;width:150px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}

  /* ---- shell ---- */
  .shell{display:grid;grid-template-columns:280px 1fr;gap:0;max-width:1180px;margin:0 auto;min-height:calc(100vh - 56px)}
  nav.side{padding:26px 16px;border-right:1px solid var(--line);background:var(--white)}
  nav.side .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 10px 12px;font-weight:700}
  .mlink{display:flex;align-items:flex-start;gap:11px;padding:10px 11px;border-radius:11px;cursor:pointer;color:var(--ink-soft);margin-bottom:2px;border:1px solid transparent}
  .mlink:hover{background:var(--paper)}
  .mlink.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .mlink.on .n{background:#fff;color:var(--ink)}
  .mlink .n{flex:none;width:23px;height:23px;border-radius:50%;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:1px solid var(--line)}
  .mlink.done .n{background:var(--green);color:#fff;border-color:var(--green)}
  .mlink .tt{font-size:13.5px;font-weight:600;line-height:1.3}
  .mlink .tk{font-size:11px;color:inherit;opacity:.7}

  main{padding:34px 46px 90px}
  .step{display:none;animation:fade .35s ease}
  .step.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kick{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
  h1{font-size:33px;line-height:1.12;margin:.1em 0 .35em;letter-spacing:-.01em}
  h2{font-size:21px;margin:1.7em 0 .5em;letter-spacing:-.01em}
  h3{font-size:16px;margin:1.3em 0 .4em}
  p{margin:.6em 0;color:var(--ink-soft);font-size:15.5px}
  .lead{font-size:18px;color:var(--ink);max-width:62ch}
  strong{color:var(--ink)}
  .pill{display:inline-block;background:var(--green-100);color:var(--green-d);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}

  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:920px){.shell{grid-template-columns:1fr}nav.side{display:none}.g2,.g3{grid-template-columns:1fr}}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
  .card .ic{width:38px;height:38px;border-radius:10px;background:var(--green-50);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;margin-bottom:10px}
  .card h3{margin:.1em 0 .3em}
  .card p{font-size:13.5px;margin:.2em 0}
  .stat{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px 22px}
  .stat .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .stat .lb{font-size:12.5px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
  .stat.red{background:var(--red)}
  .stat.green{background:var(--green)}

  figure{margin:18px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--white)}
  figure img{width:100%}
  figcaption{font-size:12.5px;color:var(--muted);padding:9px 14px;border-top:1px solid var(--line);background:var(--paper)}
  figcaption b{color:var(--ink)}

  .callout{border-left:4px solid var(--red);background:#fff;padding:14px 18px;border-radius:0 12px 12px 0;margin:18px 0}
  .callout.g{border-color:var(--green)}
  .callout .h{font-weight:800;font-size:13px;letter-spacing:.02em;margin-bottom:3px}
  ul.clean{list-style:none;padding:0;margin:.6em 0}
  ul.clean li{position:relative;padding:7px 0 7px 28px;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-soft)}
  ul.clean li:before{content:"";position:absolute;left:4px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--red)}
  ul.clean.g li:before{background:var(--green)}

  table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  table.tbl th,table.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  table.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  table.tbl td{color:var(--ink-soft)}
  table.tbl td strong{color:var(--ink)}

  .script{background:#1b1b1a;color:#f3f3f0;border-radius:var(--r);padding:18px 20px;font-size:14.5px;margin:14px 0}
  .script .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ffb3ad;font-weight:800;margin-top:12px}
  .script .who:first-child{margin-top:0}
  .script p{color:#e7e7e3;margin:3px 0 0}

  .obj{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff;overflow:hidden}
  .obj .q{padding:13px 16px;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .obj .q:after{content:"+";color:var(--red);font-weight:800}
  .obj.open .q:after{content:"\2013"}
  .obj .a{display:none;padding:0 16px 15px;font-size:14px;color:var(--ink-soft)}
  .obj.open .a{display:block}
  .obj .a .tip{display:block;margin-top:8px;font-size:12.5px;color:var(--green-d);font-weight:700;letter-spacing:.02em;text-transform:uppercase}

  .navrow{display:flex;justify-content:space-between;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
  .btn{border:0;border-radius:11px;padding:12px 22px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--red);color:#fff}
  .btn.primary:hover{background:var(--red-d)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:default}

  /* quiz */
  .quiz{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:14px 0}
  .quiz .qn{font-weight:700;font-size:15px;margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;margin:7px 0;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink-soft)}
  .opt:hover{border-color:var(--ink)}
  .opt.good{border-color:var(--green);background:var(--green-50);color:var(--green-d);font-weight:700}
  .opt.bad{border-color:var(--red);background:#fdeceb;color:var(--red-d)}
  .scorebar{position:sticky;top:56px;z-index:5;background:var(--paper);padding:8px 0 4px;font-size:13px;color:var(--muted);font-weight:700}
  .tagline{font-size:13px;color:var(--muted);font-style:italic}
</style>
</head>
<body class="lang-fr">

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 40 32" aria-label="Elite Advisors"><rect x="0" y="0" width="40" height="7" rx="1" fill="#E2382B"/><rect x="0" y="12.5" width="26" height="7" rx="1" fill="#E2382B"/><rect x="0" y="25" width="40" height="7" rx="1" fill="#E2382B"/></svg>
    <span class="nm">ELITE&nbsp;<span class="ad">ADVISORS</span></span>
    <span class="ac">Academy</span>
  </div>
  <div class="spacer"></div>
  <div class="pbar" title="Progression"><i id="pbar"></i></div>
  <div class="langtoggle">
    <button id="bfr" class="on" onclick="setLang('fr')">FR</button>
    <button id="ben" onclick="setLang('en')">EN</button>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side">
    <p class="eyebrow" data-fr="Programme commercial" data-en="Sales program"></p>
  </nav>

  <main id="main">

    <!-- 0 WELCOME -->
    <section class="step on">
      <span class="kick" data-fr="La mission" data-en="The mission"></span>
      <h1 data-fr="Vendez l'Elite Advisors Compliance Engine avec la conviction du fondateur." data-en="Sell the Elite Advisors Compliance Engine with the founder's conviction."></h1>
      <p class="lead" data-fr="Ce programme vous transforme en ambassadeur d'Elite Advisors. À la fin, vous comprendrez le produit en profondeur, vous saurez chiffrer le risque qu'il supprime, et vous pourrez le présenter, le démontrer et le vendre — avec la même passion que si vous l'aviez construit." data-en="This program turns you into an Elite Advisors ambassador. By the end you'll understand the product in depth, you'll be able to quantify the risk it removes, and you'll pitch it, demo it and sell it — with the same passion as if you'd built it yourself."></p>

      <div class="callout g">
        <div class="h" data-fr="Notre conviction" data-en="Our conviction"></div>
        <p data-fr="Une entreprise camerounaise ne devrait jamais perdre la déductibilité d'une charge ou de sa TVA parce qu'elle a payé un fournisseur non conforme sans le savoir. L'Elite Advisors Compliance Engine rend cette vérification automatique, traçable et opposable." data-en="A Cameroonian business should never lose deductibility of a cost or its VAT because it unknowingly paid a non-compliant supplier. The Elite Advisors Compliance Engine makes that check automatic, traceable and defensible."></p>
      </div>

      <h2 data-fr="Ce que vous saurez faire" data-en="What you'll be able to do"></h2>
      <div class="grid g2">
        <div class="card"><div class="ic">1</div><h3 data-fr="Chiffrer le risque" data-en="Quantify the risk"></h3><p data-fr="Mettre un chiffre en FCFA sur ce qu'un seul fournisseur non conforme coûte au client — jusqu'à 49,5 % de la facture." data-en="Put an FCFA number on what a single non-compliant supplier costs the client — up to 49.5% of the invoice."></p></div>
        <div class="card"><div class="ic">2</div><h3 data-fr="Démontrer le produit" data-en="Demo the product"></h3><p data-fr="Dérouler les 4 contrôles × 2 étapes en direct, sans hésiter, et terminer sur la preuve." data-en="Run the 4 checks × 2 stages live, without hesitating, and end on the proof."></p></div>
        <div class="card"><div class="ic">3</div><h3 data-fr="Traiter les objections" data-en="Handle objections"></h3><p data-fr="Répondre avec aplomb à « c'est trop cher », « on le fait déjà », « les portails suffisent »." data-en="Confidently answer “it's too expensive”, “we already do it”, “the portals are enough”."></p></div>
        <div class="card"><div class="ic">4</div><h3 data-fr="Conclure" data-en="Close"></h3><p data-fr="Amener le client à l'essai et au premier contrôle réalisé sur ses propres factures." data-en="Move the client to a trial and a first check run on their own invoices."></p></div>
      </div>

      <h2 data-fr="Comment se déroule le programme" data-en="How the program runs"></h2>
      <p data-fr="Neuf modules, environ une heure. Travaillez-le seul, puis rejouez la démo avec un collègue. Le module final est une certification de 25 questions : visez au moins 20/25 — c'est le niveau d'un ambassadeur Elite Advisors." data-en="Nine modules, about an hour. Work through it alone, then replay the demo with a colleague. The final module is a 25-question certification: aim for at least 20/25 — that's the level of an Elite Advisors ambassador."></p>
      <p class="tagline" data-fr="Elite Advisors — l'optimisation des processus grâce à l'IA de pointe." data-en="Elite Advisors — process optimization with best-in-class AI."></p>
    </section>

    <!-- 1 THE PROBLEM -->
    <section class="step">
      <span class="kick" data-fr="Le problème qui vaut de l'argent" data-en="The problem worth money"></span>
      <h1 data-fr="Payer le mauvais fournisseur coûte cher — jusqu'à la moitié de la facture." data-en="Paying the wrong supplier is expensive — up to half the invoice."></h1>
      <p class="lead" data-fr="Au Cameroun, le Code Général des Impôts conditionne la déductibilité de vos charges et de votre TVA à la conformité fiscale du fournisseur. Si le fournisseur est introuvable, suspendu ou radié — ou si son ACF est fausse ou périmée — l'administration peut rejeter la charge et la TVA, puis aller plus loin." data-en="In Cameroon, the General Tax Code ties the deductibility of your costs and VAT to the supplier's fiscal compliance. If the supplier is unknown, suspended or struck off — or its ACF is fake or expired — the tax authority can reject the cost and the VAT, then go further."></p>

      <h2 data-fr="Le vrai coût de la non-conformité : jusqu'à 49,5 %" data-en="The real cost of non-compliance: up to 49.5%"></h2>
      <div class="grid g3" style="margin:6px 0 4px">
        <div class="stat"><div class="big">33%</div><div class="lb" data-fr="IS sur la charge réintégrée (non déductible)" data-en="Corporate tax on the reinstated cost (non-deductible)"></div></div>
        <div class="stat red"><div class="big">+16,5%</div><div class="lb" data-fr="IRCM sur distribution réputée occulte" data-en="IRCM on deemed hidden distribution"></div></div>
        <div class="stat" style="background:var(--red-d)"><div class="big">= 49,5%</div><div class="lb" data-fr="du montant, avant pénalités & intérêts" data-en="of the amount, before penalties &amp; interest"></div></div>
      </div>
      <p data-fr="Une charge rejetée n'est pas seulement « non déductible ». Elle peut être requalifiée en distribution occulte de revenus et frappée d'IRCM. Cumulé, le redressement atteint près de la moitié de la facture — auquel s'ajoutent la TVA rejetée (19,25 %), les pénalités et les intérêts de retard." data-en="A rejected cost isn't merely “non-deductible”. It can be recharacterised as a hidden distribution of income and hit with IRCM. Combined, the reassessment approaches half the invoice — on top of the rejected VAT (19.25%), penalties and late interest."></p>

      <h2 data-fr="L'histoire vraie que vous raconterez" data-en="The true story you'll tell"></h2>
      <p data-fr="Un client paie une facture de 10 000 000 FCFA à un fournisseur qu'il croit en règle. Six mois plus tard, contrôle fiscal : le fournisseur était radié. La charge de 10 M est réintégrée (≈ 3,3 M d'IS), requalifiée en distribution occulte (≈ 1,65 M d'IRCM), la TVA de 1,6 M rejetée — soit près de 6,5 M, avant pénalités. Une facture devient une perte de plusieurs millions — évitable en 30 secondes de vérification." data-en="A client pays a 10,000,000 FCFA invoice to a supplier they believe is compliant. Six months later, a tax audit: the supplier was struck off. The 10M cost is reinstated (≈3.3M corporate tax), recharacterised as a hidden distribution (≈1.65M IRCM), and the 1.6M VAT rejected — nearly 6.5M before penalties. One invoice becomes a multi-million loss — avoidable with 30 seconds of verification."></p>

      <h2 data-fr="Pourquoi personne n'est à l'abri" data-en="Why no one is safe"></h2>
      <ul class="clean">
        <li data-fr="Un fournisseur en règle aujourd'hui peut être suspendu ou radié demain, sans vous prévenir." data-en="A supplier compliant today can be suspended or struck off tomorrow, without telling you."></li>
        <li data-fr="Les fausses ACF circulent : un document peut sembler parfait et n'avoir jamais été émis par la DGI." data-en="Fake ACFs circulate: a document can look perfect yet never have been issued by the DGI."></li>
        <li data-fr="Une ACF n'est valable que 3 mois — beaucoup paient sur une attestation périmée sans le voir." data-en="An ACF is valid for only 3 months — many pay on an expired certificate without noticing."></li>
        <li data-fr="Le contrôle porte sur le passé : la preuve doit exister au moment du paiement, pas être reconstituée après." data-en="An audit looks at the past: proof must exist at payment time, not be reconstructed afterward."></li>
      </ul>

      <div class="callout">
        <div class="h" data-fr="Le déclic commercial" data-en="The sales hook"></div>
        <p data-fr="« Vous ne payez pas pour un logiciel. Vous achetez une preuve opposable que votre diligence a été faite — celle qui fait la différence le jour du contrôle. »" data-en="&ldquo;You're not paying for software. You're buying defensible proof that your due diligence was done — the kind that matters on audit day.&rdquo;"></p>
      </div>
    </section>

    <!-- 2 WHAT IT IS -->
    <section class="step">
      <span class="kick" data-fr="La solution" data-en="The solution"></span>
      <h1 data-fr="L'Elite Advisors Compliance Engine : 4 contrôles, 2 étapes." data-en="The Elite Advisors Compliance Engine: 4 checks, 2 stages."></h1>
      <p class="lead" data-fr="En une phrase : l'Elite Advisors Compliance Engine vérifie automatiquement que chaque fournisseur que vous payez est fiscalement en règle, et conserve la preuve. Il exécute quatre contrôles, à deux moments clés du cycle de paiement, et rend un verdict clair (conforme / non conforme) avec ses preuves." data-en="In one sentence: the Elite Advisors Compliance Engine automatically checks that every supplier you pay is fiscally compliant, and keeps the proof. It runs four checks, at two key moments of the payment cycle, and returns a clear verdict (compliant / not compliant) with its evidence."></p>

      <h2 data-fr="Les 4 contrôles" data-en="The 4 checks"></h2>
      <div class="grid g2">
        <div class="card"><div class="ic">①</div><h3 data-fr="Authenticité de l'ACF" data-en="ACF authenticity"></h3><p data-fr="L'Attestation de Conformité Fiscale est-elle authentique ? Vérifiée en direct sur le portail Harmony2 de la DGI, avec capture d'écran horodatée comme preuve. Démasque les fausses attestations." data-en="Is the Fiscal Compliance Certificate genuine? Verified live on the DGI's Harmony2 portal, with a timestamped screenshot as proof. Exposes forged certificates."></p></div>
        <div class="card"><div class="ic">②</div><h3 data-fr="Statut du NIU" data-en="NIU status"></h3><p data-fr="Le contribuable est-il actif ? Lecture du statut officiel (actif / suspendu / radié) sur le portail Fiscalis de la DGI, capturée comme preuve." data-en="Is the taxpayer active? Reads the official status (active / suspended / struck off) on the DGI's Fiscalis portal, captured as proof."></p></div>
        <div class="card"><div class="ic">③</div><h3 data-fr="Existence au fichier" data-en="Register existence"></h3><p data-fr="Le NIU figure-t-il au fichier national des contribuables de la DGI, téléchargé et archivé automatiquement chaque nuit à minuit ?" data-en="Is the NIU in the DGI's national taxpayer register, downloaded and stored automatically every night at midnight?"></p></div>
        <div class="card"><div class="ic">④</div><h3 data-fr="Validité de l'ACF" data-en="ACF validity"></h3><p data-fr="L'attestation est-elle encore en cours de validité (émission + 3 mois, art. L 94) ? Avec compte à rebours et alerte avant expiration." data-en="Is the certificate still in force (issue + 3 months, art. L 94)? With a countdown and a pre-expiry alert."></p></div>
      </div>

      <div class="callout"><div class="h" data-fr="Le fichier national, à jour chaque nuit" data-en="The national register, refreshed nightly"></div><p data-fr="Le contrôle d'existence (③) s'appuie sur le fichier officiel des contribuables de la DGI, que la plateforme télécharge et archive automatiquement chaque nuit à minuit. Vos vérifications s'appuient toujours sur la liste la plus récente, sans aucune action de votre part." data-en="The existence check (③) relies on the DGI's official taxpayer register, which the platform downloads and stores automatically every night at midnight. Your checks always run against the freshest list, with no action on your part."></p></div>

      <h2 data-fr="Les 2 étapes" data-en="The 2 stages"></h2>
      <div class="grid g2">
        <div class="card" style="border-top:3px solid var(--green)"><h3 data-fr="Enregistrement" data-en="Recording"></h3><p data-fr="À la réception de la facture : on scanne l'ACF, on lit la facture (OCR) et on contrôle le fournisseur avant de comptabiliser. La preuve est capturée à cet instant." data-en="When the invoice arrives: scan the ACF, read the invoice (OCR) and check the supplier before booking it. The proof is captured at that moment."></p></div>
        <div class="card" style="border-top:3px solid var(--ink)"><h3 data-fr="Règlement" data-en="Settlement"></h3><p data-fr="Au moment de payer : on revérifie (par lots si besoin). Une ACF expirée ou un NIU devenu inactif bloque le paiement — avant que l'argent ne sorte." data-en="At payment time: re-check (in batches if needed). An expired ACF or a now-inactive NIU blocks the payment — before the money leaves."></p></div>
      </div>
      <div class="callout g"><div class="h" data-fr="Pourquoi deux étapes ?" data-en="Why two stages?"></div><p data-fr="Parce que la conformité change avec le temps. Un fournisseur en règle à la commande peut ne plus l'être au paiement, parfois plusieurs semaines plus tard. Le client est protégé aux deux moments — c'est ce que les portails de la DGI, utilisés à la main, ne font pas." data-en="Because compliance changes over time. A supplier compliant at order time may not be at payment, sometimes weeks later. The client is protected at both moments — which the DGI portals, used by hand, do not do."></p></div>

      <h2 data-fr="Et la conformité de la facture elle-même" data-en="And the invoice's own compliance"></h2>
      <p data-fr="Au-delà du fournisseur, le moteur lit la facture et vérifie ses conditions de forme et de fond alignées sur le CGI (art. 150) : mentions obligatoires, identité du client, montants. Un résultat clair, avec les preuves à l'appui, vous dit exactement pourquoi une facture passe ou échoue." data-en="Beyond the supplier, the engine reads the invoice and checks its form and substance conditions aligned with the Tax Code (art. 150): mandatory mentions, client identity, amounts. A clear result, with supporting evidence, tells you exactly why an invoice passes or fails."></p>
    </section>

    <!-- 3 GUIDED TOUR -->
    <section class="step">

    <section class="step">

      <h1 data-fr="À qui parler, quoi dire, comment répondre." data-en="Who to talk to, what to say, how to respond."></h1>

      <h2 data-fr="Le pitch en 30 secondes" data-en="The 30-second pitch"></h2>
      <div class="script">
        <div class="who" data-fr="Vous" data-en="You"></div>
        <p data-fr="« L'Elite Advisors Compliance Engine vérifie automatiquement chaque fournisseur que vous payez — authenticité de l'ACF, statut du NIU, existence au fichier, validité — et conserve la preuve horodatée. Si un fournisseur n'est pas en règle, vous le savez avant de payer, pas au contrôle. Résultat : votre TVA et vos charges restent déductibles, et vous détenez une preuve opposable. Je vous le montre en 5 minutes sur l'une de vos factures ? »" data-en="“The Elite Advisors Compliance Engine automatically checks every supplier you pay — ACF authenticity, NIU status, register existence, validity — and keeps timestamped proof. If a supplier isn't compliant, you know before you pay, not at the audit. The result: your VAT and costs stay deductible, and you hold defensible proof. Can I show you in 5 minutes on one of your invoices?”"></p>
      </div>

      <h2 data-fr="Traiter les objections — avec la bonne réplique" data-en="Handling objections — with the right reply"></h2>
      <div class="obj"><div class="q" data-fr="« On le fait déjà manuellement. »" data-en="“We already do it manually.”"></div><div class="a"><span data-fr="Reconnaissez, puis chiffrez le coût caché. Demandez : combien de factures par mois, à combien de minutes l'unité ? À 5 minutes pour 100 factures, c'est plus de 8 heures perdues chaque mois — et six mois plus tard, où est la preuve ? Le manuel ne laisse aucune trace opposable, aucune alerte d'expiration, aucune revérification au paiement. Vous ne remplacez pas vos équipes : vous leur donnez un filet de sécurité et une preuve archivée automatiquement." data-en="Acknowledge, then quantify the hidden cost. Ask: how many invoices a month, at how many minutes each? At 5 minutes for 100 invoices, that's over 8 hours lost every month — and six months later, where's the proof? Manual leaves no defensible trail, no expiry alert, no re-check at payment. You're not replacing your team: you're giving them a safety net and proof archived automatically."></span><span class="tip" data-fr="Astuce : faites-lui dire son volume — le calcul des heures perdues se fait tout seul." data-en="Tip: get them to state their volume — the lost-hours math does itself."></span></div></div>

      <div class="obj"><div class="q" data-fr="« C'est trop cher. »" data-en="“It's too expensive.”"></div><div class="a"><span data-fr="Ne défendez pas le prix — recadrez-le face au coût de la non-conformité, qui peut atteindre 49,5 % de la facture : 33 % d'IS sur la charge réintégrée (non déductible) + 16,5 % d'IRCM sur la distribution réputée occulte de revenus. Sur une facture de 10 M, c'est près de 5 M de redressement, sans compter la TVA, les pénalités et les intérêts. L'abonnement est une fraction de ce risque. Et au-delà du redressement évité, la conformité assure la continuité d'exploitation, une trésorerie maîtrisée et une planification fiable de la performance. « Le moteur n'a qu'à éviter un seul rejet pour être rentable. »" data-en="Don't defend the price — reframe it against the cost of non-compliance, which can reach 49.5% of the invoice: 33% corporate tax on the reinstated (non-deductible) cost + 16.5% IRCM on the deemed hidden distribution of income. On a 10M invoice that's nearly 5M of reassessment, before VAT, penalties and interest. The subscription is a fraction of that risk. And beyond the avoided reassessment, compliance secures operational continuity, controlled cashflow and reliable performance planning. “The engine only has to prevent one rejection to pay for itself.”"></span><span class="tip" data-fr="Astuce : comparez au coût d'UN rejet, jamais à zéro." data-en="Tip: compare to the cost of ONE rejection, never to zero."></span></div></div>

      <div class="obj"><div class="q" data-fr="« Les portails de la DGI suffisent. »" data-en="“The DGI portals are enough.”"></div><div class="a"><span data-fr="Les portails donnent une réponse à un instant T, à la main, un fournisseur à la fois — sans preuve conservée, sans alerte d'expiration, sans revérification au paiement, sans centralisation. Le jour du contrôle, une capture d'écran non horodatée ne vaut rien. Le moteur orchestre les 4 contrôles, aux 2 étapes, et archive une preuve opposable et horodatée. « C'est la différence entre vérifier… et pouvoir le prouver six mois plus tard. »" data-en="The portals give an answer at a point in time, by hand, one supplier at a time — with no stored proof, no expiry alert, no re-check at payment, no central record. On audit day, an un-timestamped screenshot is worthless. The engine orchestrates all 4 checks, at both stages, and archives defensible, timestamped proof. “That's the difference between checking… and being able to prove it six months later.”"></span><span class="tip" data-fr="Astuce : insistez sur la PREUVE et la revérification au paiement — ce que le portail ne fait pas." data-en="Tip: stress the PROOF and the re-check at payment — what the portal cannot do."></span></div></div>

      <div class="obj"><div class="q" data-fr="« Nous faisons confiance à nos fournisseurs. »" data-en="“We trust our suppliers.”"></div><div class="a"><span data-fr="La confiance n'est pas opposable à l'administration. Un fournisseur de longue date peut être radié ou suspendu sans vous prévenir — et c'est VOUS qui perdez la déductibilité, pas lui. Le moteur ne remet pas en cause la relation : il la documente. « Vous gardez vos fournisseurs ; vous y ajoutez simplement une preuve. »" data-en="Trust isn't defensible before the tax authority. A long-standing supplier can be struck off or suspended without warning you — and it's YOU who loses deductibility, not them. The engine doesn't question the relationship: it documents it. “You keep your suppliers; you just add proof.”"></span><span class="tip" data-fr="Astuce : dissociez la relation humaine du risque fiscal — ce sont deux sujets." data-en="Tip: separate the human relationship from the fiscal risk — two different topics."></span></div></div>

      <div class="obj"><div class="q" data-fr="« On verra ça après le prochain contrôle. »" data-en="“We'll deal with it after the next audit.”"></div><div class="a"><span data-fr="Trop tard : le redressement porte sur le passé. La preuve doit exister AU MOMENT de la transaction — elle ne se reconstitue pas après coup. Chaque mois sans le moteur est un mois de factures non protégées. « Commencer aujourd'hui protège tout ce que vous payez à partir de maintenant. »" data-en="Too late: a reassessment looks at the past. Proof must exist AT the moment of the transaction — it can't be reconstructed afterward. Every month without the engine is a month of unprotected invoices. “Starting today protects everything you pay from now on.”"></span><span class="tip" data-fr="Astuce : créez l'urgence — le risque court déjà sur les factures de ce mois." data-en="Tip: create urgency — the risk already runs on this month's invoices."></span></div></div>

      <div class="obj"><div class="q" data-fr="« Notre comptable s'en occupe. »" data-en="“Our accountant handles it.”"></div><div class="a"><span data-fr="Le comptable enregistre ; il n'a ni le temps ni l'outil pour vérifier l'authenticité de chaque ACF et le statut de chaque NIU à deux moments. Le moteur lui donne précisément cet outil — et une preuve qu'il pourra présenter. C'est un allié du comptable, pas un remplaçant. Proposez même de le présenter ensemble." data-en="The accountant records; they have neither the time nor the tool to verify every ACF's authenticity and every NIU's status at two moments. The engine gives them exactly that tool — and proof they can present. It's the accountant's ally, not a replacement. Offer to present it to them together."></span><span class="tip" data-fr="Astuce : faites du comptable un champion interne, pas un obstacle." data-en="Tip: turn the accountant into an internal champion, not a blocker."></span></div></div>

      <div class="obj"><div class="q" data-fr="« Nos données sont-elles en sécurité ? »" data-en="“Is our data safe?”"></div><div class="a"><span data-fr="Oui — isolation par espace (chaque client dans sa propre base), chiffrement en transit et au repos, preuves immuables (Object Lock) horodatées, 2FA obligatoire, conformité à la Loi N° 2024/017. Personne — pas même nous — ne peut altérer une preuve après coup. « Vos données fiscales sont plus en sécurité chez nous que dans un classeur ou une boîte mail. »" data-en="Yes — workspace isolation (each client in its own database), encryption in transit and at rest, immutable (object-lock) timestamped evidence, mandatory 2FA, compliance with Law 2024/017. No one — not even us — can alter a piece of evidence after the fact. “Your fiscal data is safer with us than in a binder or an inbox.”"></span><span class="tip" data-fr="Astuce : transformez la sécurité en argument de vente, pas en simple réassurance." data-en="Tip: turn security into a selling point, not just reassurance."></span></div></div>
    </section>

    <section class="step">
      <span class="kick" data-fr="Sécurité des données" data-en="Data security"></span>
      <h1 data-fr="La sécurité n'est pas une option — c'est un argument de vente." data-en="Security isn't optional — it's a selling point."></h1>
      <p class="lead" data-fr="Vos clients confient des données fiscales sensibles à la plateforme. Voici comment elles sont protégées — et comment vous en faites un atout face à la concurrence et au DSI du client." data-en="Your clients trust the platform with sensitive fiscal data. Here's how it's protected — and how you turn that into an advantage over competitors and the client's IT lead."></p>

      <div class="grid g3" style="margin:18px 0">
        <div class="card"><div class="ic">🛡</div><h3 data-fr="Isolation par espace" data-en="Workspace isolation"></h3><p data-fr="Chaque client possède sa propre base de données. Aucune donnée n'est partagée entre clients." data-en="Each client has its own database. No data is shared between clients."></p></div>
        <div class="card"><div class="ic">🔒</div><h3 data-fr="Preuves immuables" data-en="Immutable evidence"></h3><p data-fr="Captures verrouillées (Object Lock), horodatées, avec empreinte SHA-256 infalsifiable." data-en="Object-lock storage, timestamped, with a tamper-proof SHA-256 fingerprint."></p></div>
        <div class="card"><div class="ic">🔐</div><h3 data-fr="Chiffrement" data-en="Encryption"></h3><p data-fr="Données chiffrées en transit (HTTPS/TLS) et au repos." data-en="Data encrypted in transit (HTTPS/TLS) and at rest."></p></div>
      </div>

      <h2 data-fr="Contrôles d'accès" data-en="Access controls"></h2>
      <ul class="clean g">
        <li data-fr="Double authentification (2FA) obligatoire à la connexion." data-en="Mandatory two-factor authentication (2FA) at sign-in."></li>
        <li data-fr="Mots de passe hachés à sens unique — jamais stockés en clair, illisibles même par nos équipes." data-en="One-way hashed passwords — never stored in clear, unreadable even by our team."></li>
        <li data-fr="Journal d'accès : chaque consultation ou export de données personnelles est tracé." data-en="Access log: every view or export of personal data is recorded."></li>
        <li data-fr="Rôles distincts (administration, enregistrement, règlement) pour limiter qui voit quoi." data-en="Distinct roles (admin, recording, settlement) to limit who sees what."></li>
      </ul>

     {fr:"la déclaration du fournisseur",en:"the supplier's own declaration",ok:0},
     {fr:"le registre du commerce uniquement",en:"the trade register only",ok:0}]},
 {fr:"Le fichier national des contribuables est…",en:"The national taxpayer register is…",

     {fr:"saisi à la main par le client",en:"entered by hand by the client",ok:0},

 {fr:"Une ACF est valable…",en:"An ACF is valid for…",

 {fr:"Pourquoi deux étapes (enregistrement & règlement) ?",en:"Why two stages (recording & settlement)?",

 {fr:"La conformité de la facture elle-même est alignée sur…",en:"The invoice's own compliance is aligned with…",

     {fr:"le code du travail",en:"the labour code",ok:0},

 {fr:"Que vend-on vraiment au client ?",en:"What are we really selling?",

 {fr:"La preuve d'un contrôle est archivée…",en:"A check's evidence is stored…",

     {fr:"dans un fichier modifiable",en:"in an editable file",ok:0},
     {fr:"seulement 24 heures",en:"for only 24 hours",ok:0}]},
 {fr:"L'empreinte qui garantit l'intégrité d'une preuve est…",en:"The fingerprint guaranteeing a piece of evidence is…",

     {fr:"un simple numéro de série",en:"a plain serial number",ok:0},
     {fr:"la date seule",en:"the date alone",ok:0}]},
 {fr:"Le client idéal est…",en:"The ideal client is…",
  o:[{fr:"une entreprise au régime réel avec de nombreux fournisseurs",en:"a real-regime business with many suppliers",ok:1},
     {fr:"un particulier sans activité",en:"a private individual with no business",ok:0},
     {fr:"une entreprise sans aucun fournisseur",en:"a business with no suppliers at all",ok:0}]},
 {fr:"Face à « c'est trop cher », vous…",en:"Faced with “it's too expensive”, you…",

     {fr:"baissez immédiatement le prix",en:"immediately drop the price",ok:0},
     {fr:"changez de sujet",en:"change the subject",ok:0}]},
 {fr:"Face à « les portails de la DGI suffisent », l'argument clé est…",en:"For “the DGI portals are enough”, the key argument is…",
  o:[{fr:"pas de preuve conservée, ni alerte, ni revérification au paiement",en:"no stored proof, no alert, no re-check at payment",ok:1},
     {fr:"les portails sont payants",en:"the portals are paid",ok:0},
     {fr:"les portails sont illégaux",en:"the portals are illegal",ok:0}]},
 {fr:"Face à « on verra après le contrôle », vous rappelez que…",en:"For “we'll deal with it after the audit”, you remind that…",
  o:[{fr:"la preuve doit exister au moment de la transaction",en:"proof must exist at the moment of the transaction",ok:1},
     {fr:"le contrôle ne porte que sur l'avenir",en:"an audit only looks at the future",ok:0},

 {fr:"Chaque espace client est…",en:"Each client workspace is…",
  o:[{fr:"isolé dans sa propre base de données",en:"isolated in its own database",ok:1},
     {fr:"partagé entre tous les clients",en:"shared across all clients",ok:0},
     {fr:"stocké sur le poste du client",en:"stored on the client's computer",ok:0}]},
 {fr:"La connexion à la plateforme exige…",en:"Signing in to the platform requires…",
  o:[{fr:"une double authentification (2FA) obligatoire",en:"mandatory two-factor authentication (2FA)",ok:1},
     {fr:"un simple mot de passe à 4 chiffres",en:"a simple 4-digit password",ok:0},
     {fr:"aucune authentification",en:"no authentication",ok:0}]},
 {fr:"La protection des données personnelles suit…",en:"Personal-data protection follows…",
  o:[{fr:"la Loi camerounaise N° 2024/017",en:"Cameroon's Law N° 2024/017",ok:1},
     {fr:"aucune réglementation",en:"no regulation",ok:0},
     {fr:"une norme européenne uniquement",en:"a European standard only",ok:0}]},
 {fr:"La règle d'or de la démo est…",en:"The golden rule of the demo is…",
  o:[{fr:"toujours terminer sur la preuve",en:"always end on the proof",ok:1},
     {fr:"commencer par le prix",en:"start with the price",ok:0},
     {fr:"montrer le code technique",en:"show the technical code",ok:0}]},
];

let cur=0, lang='fr', done=new Set();
const steps=[...document.querySelectorAll('.step')];
const QI = steps.length-1;

function applyLang(){
  document.querySelectorAll('[data-fr]').forEach(el=>{
    const t=el.getAttribute('data-'+lang);
    if(t!==null) el.textContent=t;
  });
}
function setLang(l){
  lang=l; document.documentElement.lang=l;
  bfr.classList.toggle('on',l==='fr'); ben.classList.toggle('on',l==='en');
  render();
}
function buildSide(){
  const s=document.getElementById('side');
  s.innerHTML='<p class="eyebrow">'+(lang==='fr'?'Programme commercial':'Sales program')+'</p>';
  MOD.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='mlink'+(i===cur?' on':'')+(done.has(i)?' done':'');
    d.onclick=()=>{cur=i;render()};
    d.innerHTML='<span class="n">'+(done.has(i)?'✓':(i+1))+'</span><span><span class="tt">'+m[lang]+'</span><br><span class="tk">'+m.tk+'</span></span>';
    s.appendChild(d);
  });
}
function render(){
  steps.forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.getElementById('prev').disabled=cur===0;
  const nx=document.getElementById('next');
  nx.setAttribute('data-fr', cur===steps.length-1?'Terminer ✓':'Suivant →');
  nx.setAttribute('data-en', cur===steps.length-1?'Finish ✓':'Next →');
  document.getElementById('pbar').style.width=Math.round((done.size)/MOD.length*100)+'%';
  if(cur===QI) buildQuiz();
  buildSide();
  applyLang();
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(d){
  done.add(cur);
  if(d>0 && cur===steps.length-1){ done.add(cur); render(); return; }
  cur=Math.max(0,Math.min(steps.length-1,cur+d));
  render();
}
function updateScore(){
  const ans=document.querySelectorAll('#quiz .quiz[data-answered]').length;
  const el=document.getElementById('score');
  el.setAttribute('data-fr', ans+' / '+QUIZ.length+' répondues');
  el.setAttribute('data-en', ans+' / '+QUIZ.length+' answered');
  el.textContent = ans+' / '+QUIZ.length+(lang==='fr'?' répondues':' answered');
}
function buildQuiz(){
  const wrap=document.getElementById('quiz'); if(wrap.dataset.built) return; wrap.dataset.built=1;
  QUIZ.forEach((q,qi)=>{
    const box=document.createElement('div'); box.className='quiz';
    const h=document.createElement('div'); h.className='qn'; h.textContent=(qi+1)+'. '+q[lang]; h.dataset.fr=(qi+1)+'. '+q.fr; h.dataset.en=(qi+1)+'. '+q.en; box.appendChild(h);
    q.o.forEach((o,oi)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o[lang]; b.dataset.fr=o.fr; b.dataset.en=o.en;
      b.onclick=()=>{
        if(box.dataset.answered) return; box.dataset.answered=1;
        b.classList.add(o.ok?'good':'bad');
        if(!o.ok){[...box.querySelectorAll('.opt')].forEach((x,xi)=>{if(q.o[xi].ok)x.classList.add('good')});}
        updateScore(); checkDone();
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
  });
  updateScore();
}
function checkDone(){
  const all=[...document.querySelectorAll('#quiz .quiz')];
  if(all.length && all.every(b=>b.dataset.answered)){ document.getElementById('quizdone').style.display='block'; done.add(QI); render(); }
}
document.querySelectorAll('.obj').forEach(o=>{
  const q=o.querySelector('.q');
  if(q) q.addEventListener('click',()=>o.classList.toggle('open'));
});
render();
</script>
